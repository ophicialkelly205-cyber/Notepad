<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Notepad App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            border: none;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .new-btn {
            background: #2563eb;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .export-btn {
            background: #059669;
            color: white;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
            background: white;
        }

        input:focus, textarea:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        textarea {
            height: 300px;
            resize: vertical;
            line-height: 1.6;
        }

        .notes-section {
            margin-top: 30px;
        }

        .notes-section h2 {
            margin-bottom: 15px;
        }

        .note-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
        }

        .note-item:hover {
            background: #dbeafe;
        }

        .note-item h3 {
            margin-bottom: 8px;
        }

        .note-item p {
            color: #64748b;
            overflow-wrap: anywhere;
        }

        .status {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin-top: 20px;
            }

            textarea {
                height: 250px;
            }

            button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>📝 My Notepad</h1>
        <p>Write, save, and manage your notes</p>
    </header>

    <div class="container">

        <div class="toolbar">
            <button class="new-btn" onclick="newNote()">
                + New Note
            </button>

            <button class="delete-btn" onclick="deleteNote()">
                Delete Note
            </button>

            <button class="export-btn" onclick="exportNote()">
                Export Note
            </button>
        </div>

        <p class="status" id="status">
            Your notes are saved automatically.
        </p>

        <input
            type="text"
            id="noteTitle"
            placeholder="Enter note title..."
            aria-label="Note title"
        >

        <textarea
            id="noteContent"
            placeholder="Start writing your note here..."
            aria-label="Note content"
        ></textarea>

        <div class="notes-section">
            <h2>My Notes</h2>

            <input
                type="search"
                id="searchInput"
                placeholder="Search your notes..."
                aria-label="Search notes"
            >

            <div id="notesList"></div>
        </div>

    </div>

    <footer>
        <p>Simple Notepad App &copy; 2026</p>
    </footer>

    <script>
        // Get HTML elements
        const titleInput = document.getElementById("noteTitle");
        const contentInput = document.getElementById("noteContent");
        const notesList = document.getElementById("notesList");
        const searchInput = document.getElementById("searchInput");
        const status = document.getElementById("status");

        // Load notes from browser storage
        let notes = [];

        try {
            notes = JSON.parse(
                localStorage.getItem("myNotes") || "[]"
            );

            if (!Array.isArray(notes)) {
                notes = [];
            }
        } catch (error) {
            notes = [];
        }

        let currentNoteId = null;
        let saveTimer;

        // Save notes to localStorage
        function saveNotes() {
            try {
                localStorage.setItem(
                    "myNotes",
                    JSON.stringify(notes)
                );

                status.textContent = "All changes saved.";
            } catch (error) {
                status.textContent =
                    "Unable to save notes. Browser storage may be full.";
            }
        }

        // Save the currently selected note
        function saveCurrentNote() {
            clearTimeout(saveTimer);

            if (currentNoteId === null) {
                return;
            }

            const note = notes.find(
                item => item.id === currentNoteId
            );

            if (!note) {
                return;
            }

            note.title = titleInput.value;
            note.content = contentInput.value;
            note.updatedAt = Date.now();

            saveNotes();
            displayNotes();
        }

        // Automatically save after typing
        function scheduleSave() {
            status.textContent = "Saving...";

            clearTimeout(saveTimer);

            saveTimer = setTimeout(
                saveCurrentNote,
                400
            );
        }

        // Create a new note
        function newNote() {
            saveCurrentNote();

            const note = {
                id: Date.now().toString() +
                    Math.random().toString(36).slice(2),
                title: "",
                content: "",
                updatedAt: Date.now()
            };

            notes.unshift(note);

            currentNoteId = note.id;

            titleInput.value = "";
            contentInput.value = "";

            saveNotes();
            displayNotes();

            titleInput.focus();
        }

        // Open an existing note
        function openNote(id) {
            saveCurrentNote();

            const note = notes.find(
                item => item.id === id
            );

            if (!note) {
                return;
            }

            currentNoteId = note.id;

            titleInput.value = note.title;
            contentInput.value = note.content;

            status.textContent = "Editing note.";

            displayNotes();
        }

        // Display all notes
        function displayNotes() {
            const query = searchInput.value.toLowerCase();

            notesList.innerHTML = "";

            const filteredNotes = notes.filter(note => {
                const title = (note.title || "").toLowerCase();
                const content = (note.content || "").toLowerCase();

                return title.includes(query) ||
                       content.includes(query);
            });

            if (filteredNotes.length === 0) {
                notesList.textContent = "No notes found.";
                return;
            }

            filteredNotes.forEach(note => {
                const item = document.createElement("div");
                item.className = "note-item";

                const heading = document.createElement("h3");
                heading.textContent =
                    note.title.trim() || "Untitled Note";

                const paragraph = document.createElement("p");
                paragraph.textContent =
                    (note.content || "").slice(0, 100) ||
                    "No content yet.";

                const date = document.createElement("small");
                date.textContent = new Date(
                    note.updatedAt
                ).toLocaleString();

                item.appendChild(heading);
                item.appendChild(paragraph);
                item.appendChild(date);

                item.addEventListener("click", function() {
                    openNote(note.id);
                });

                if (note.id === currentNoteId) {
                    item.style.border = "2px solid #2563eb";
                }

                notesList.appendChild(item);
            });
        }

        // Delete the current note
        function deleteNote() {
            if (currentNoteId === null) {
                alert("Please select a note to delete.");
                return;
            }

            const note = notes.find(
                item => item.id === currentNoteId
            );

            if (!confirm(
                "Are you sure you want to delete this note?"
            )) {
                return;
            }

            notes = notes.filter(
                item => item.id !== currentNoteId
            );

            currentNoteId = null;

            titleInput.value = "";
            contentInput.value = "";

            saveNotes();
            displayNotes();

            status.textContent = "Note deleted.";
        }

        // Export current note as a text file
        function exportNote() {
            saveCurrentNote();

            const note = notes.find(
                item => item.id === currentNoteId
            );

            if (!note) {
                alert("Please select a note to export.");
                return;
            }

            const text =
                (note.title || "Untitled Note") +
                "\n\n" +
                (note.content || "");

            const blob = new Blob(
                [text],
                { type: "text/plain;charset=utf-8" }
            );

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href = url;
            link.download =
                (note.title.trim() || "note") + ".txt";

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);
        }

        // Listen for typing
        titleInput.addEventListener(
            "input",
            scheduleSave
        );

        contentInput.addEventListener(
            "input",
            scheduleSave
        );

        // Search notes
        searchInput.addEventListener(
            "input",
            displayNotes
        );

        // Save when leaving the page
        window.addEventListener(
            "pagehide",
            saveCurrentNote
        );

        // Load existing notes
        displayNotes();

        // Open the most recently edited note
        if (notes.length > 0) {
            const latestNote = [...notes].sort(
                (a, b) => b.updatedAt - a.updatedAt
            )[0];

            openNote(latestNote.id);
        }
    </script>

</body>
  </html>
